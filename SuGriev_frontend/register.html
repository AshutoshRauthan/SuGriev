<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="SUGRIEV Public Grievance Portal - File a complaint with local government departments">
    <title>Register Complaint | SuGiev Public Grievance Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- =========================================================================
         HEADER / NAVIGATION
         ========================================================================= -->
    <header class="header">
        <div class="header__brand">
            <div class="header__logo">
                <img src="assets/logo.png" alt="SUGRIEV Logo">
            </div>
            <div class="header__title">
                <h1>SuGriev</h1>
                <span>
                    Public Grievance Portal | जन शिकायत पोर्टल
                </span>
            </div>
        </div>

    </header>

    <!-- =========================================================================
         MAIN CONTENT
         ========================================================================= -->
    <main class="main">
        <!-- Page Header -->
        <div class="page-header">
            <h1 class="page-header__title">REGISTER COMPLAINT</h1>
            <p class="page-header__subtitle">शिकायत दर्ज करें</p>
        </div>

        <!-- Complaint Registration Form -->
        <form id="complaint-form" action="#" method="POST">

            <!-- =====================================================
                 SECTION 1: Complainant's Information
                 ===================================================== -->
            <section class="form-section">
                <div class="form-section__header">
                    Complainant's Information (शिकायतकर्ता की जानकारी)
                </div>
                <div class="form-section__content">
                    <div class="form-grid">
                        <!-- First Name -->
                        <div class="form-group">
                            <label for="first_name">
                                First Name <span class="label-hindi">(प्रथम नाम)</span>
                                <span class="required">*</span>
                            </label>
                            <input type="text" id="first_name" name="first_name" placeholder="Enter First Name"
                                required>
                        </div>

                        <!-- Last Name -->
                        <div class="form-group">
                            <label for="last_name">
                                Last Name <span class="label-hindi">(उपनाम)</span>
                                <span class="required">*</span>
                            </label>
                            <input type="text" id="last_name" name="last_name" placeholder="Enter Last Name" required>
                        </div>

                        <!-- Email -->
                        <div class="form-group">
                            <label for="email">
                                Email <span class="label-hindi">(ईमेल)</span>
                                <span class="required">*</span>
                            </label>
                            <input type="email" id="email" name="email" placeholder="Enter Email" required>
                        </div>

                        <!-- Gender -->
                        <div class="form-group">
                            <label for="gender">
                                Gender <span class="label-hindi">(लिंग)</span>
                                <span class="required">*</span>
                            </label>
                            <select id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <!-- Mobile Number -->
                        <div class="form-group">
                            <label for="mobile_number">
                                Mobile Number <span class="label-hindi">(मोबाइल नंबर)</span>
                                <span class="required">*</span>
                            </label>
                            <input type="tel" id="mobile_number" name="mobile_number"
                                placeholder="Enter 10-digit Mobile Number" pattern="[0-9]{10}" maxlength="10" required>
                        </div>

                        <!-- District -->
                        <div class="form-group">
                            <label for="district">
                                District <span class="label-hindi">(जिला)</span>
                                <span class="required">*</span>
                            </label>
                            <select id="district" name="district" required>
                                <option value="">Select District</option>
                                <option value="Almora">Almora</option>
                                <option value="Bageshwar">Bageshwar</option>
                                <option value="Chamoli">Chamoli</option>
                                <option value="Champawat">Champawat</option>
                                <option value="Dehradun">Dehradun</option>
                                <option value="Haridwar">Haridwar</option>
                                <option value="Nainital">Nainital</option>
                                <option value="Pauri Garhwal">Pauri Garhwal</option>
                                <option value="Pithoragarh">Pithoragarh</option>
                                <option value="Rudraprayag">Rudraprayag</option>
                                <option value="Tehri Garhwal">Tehri Garhwal</option>
                                <option value="Udham Singh Nagar">Udham Singh Nagar</option>
                                <option value="Uttarkashi">Uttarkashi</option>
                            </select>
                        </div>

                        <!-- Block -->
                        <div class="form-group">
                            <label for="block">
                                Block <span class="label-hindi">(ब्लॉक)</span>
                            </label>
                            <select id="block" name="block">
                                <option value="">Select Block</option>
                            </select>
                        </div>

                        <!-- Village / City -->
                        <div class="form-group">
                            <label for="village_city">
                                Village / City <span class="label-hindi">(गांव / शहर)</span>
                            </label>
                            <input type="text" id="village_city" name="village_city" placeholder="Enter Village / City">
                        </div>

                        <!-- Pin Code -->
                        <div class="form-group">
                            <label for="pin_code">
                                Pin Code <span class="label-hindi">(पिन कोड)</span>
                            </label>
                            <input type="text" id="pin_code" name="pin_code" placeholder="Enter Pin Code"
                                pattern="[0-9]{6}" maxlength="6">
                        </div>

                        <!-- Address (Full Width) -->
                        <div class="form-group form-group--full">
                            <label for="address">
                                Address <span class="label-hindi">(पता)</span>
                                <span class="required">*</span>
                            </label>
                            <textarea id="address" name="address" placeholder="Enter Address" rows="3"
                                required></textarea>
                        </div>
                    </div>
                </div>
            </section>

            <!-- =====================================================
                 SECTION 2: Complaint Details
                 ===================================================== -->
            <section class="form-section">
                <div class="form-section__header">
                    Complaint Details (शिकायत का विवरण)
                </div>
                <div class="form-section__content">
                    <div class="form-grid">
                        <!-- Department -->
                        <div class="form-group">
                            <label for="department">
                                Department <span class="label-hindi">(विभाग)</span>
                                <span class="required">*</span>
                            </label>
                            <select id="department" name="department" required>
                                <option value="">Select Department</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>

                        <!-- Sub Department -->
                        <div class="form-group">
                            <label for="sub_department">
                                Sub Department <span class="label-hindi">(उप विभाग)</span>
                                <span class="required">*</span>
                            </label>
                            <select id="sub_department" name="sub_department" required>
                                <option value="">Select Sub Department</option>
                                <!-- Populated via JS -->
                            </select>
                        </div>

                        <!-- Attributes -->
                        <div class="form-group">
                            <label for="attributes">
                                Attributes <span class="label-hindi">(विशेषता)</span>
                            </label>
                            <select id="attributes" name="attributes">
                                <option value="">Select Attributes</option>
                                <option value="maintenance">Maintenance (रखरखाव)</option>
                                <option value="repair">Repair (मरम्मत)</option>
                                <option value="new_request">New Construction Request (नई निर्माण मांग)</option>
                                <option value="safety_issue">Safety Hazard (सुरक्षा खतरा)</option>
                                <option value="clealiness">Cleanliness/Hygiene (सफाई/स्वच्छता)</option>
                                <option value="delay">Delay in Service (सेवा में देरी)</option>
                                <option value="misconduct">Staff Misconduct (कर्मचारी दुर्व्यवहार)</option>
                                <option value="corruption">Corruption/Bribery (भ्रष्टाचार/रिश्वत)</option>
                                <option value="quality">Poor Quality of Work (घटिया गुणवत्ता)</option>
                                <option value="billing">Billing/Overcharging (बिलिंग/अधिक शुल्क)</option>
                                <option value="encroachment">Encroachment (अतिक्रमण)</option>
                                <option value="other">Other (अन्य)</option>
                            </select>
                        </div>

                        <!-- Complaint District -->
                        <div class="form-group">
                            <label for="complaint_district">
                                Complaint District <span class="label-hindi">(जिला)</span>
                                <span class="required">*</span>
                            </label>
                            <select id="complaint_district" name="complaint_district" required>
                                <option value="">Select District</option>
                                <option value="Almora">Almora</option>
                                <option value="Bageshwar">Bageshwar</option>
                                <option value="Chamoli">Chamoli</option>
                                <option value="Champawat">Champawat</option>
                                <option value="Dehradun">Dehradun</option>
                                <option value="Haridwar">Haridwar</option>
                                <option value="Nainital">Nainital</option>
                                <option value="Pauri Garhwal">Pauri Garhwal</option>
                                <option value="Pithoragarh">Pithoragarh</option>
                                <option value="Rudraprayag">Rudraprayag</option>
                                <option value="Tehri Garhwal">Tehri Garhwal</option>
                                <option value="Udham Singh Nagar">Udham Singh Nagar</option>
                                <option value="Uttarkashi">Uttarkashi</option>
                            </select>
                        </div>

                        <!-- Complaint Description (Full Width) -->
                        <div class="form-group form-group--full">
                            <label for="complaint_description">
                                Complaint Description <span class="label-hindi">(शिकायत विवरण)</span>
                                <span class="required">*</span>
                            </label>
                            <textarea id="complaint_description" name="complaint_description"
                                placeholder="Enter complaint details here... (Maximum 500 words)" rows="6"
                                required></textarea>
                            <div class="textarea-footer">
                                <span class="word-count" id="word-count">0/500 words</span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Form Submit Button -->
            <div class="form-actions">
                <button type="submit" class="btn btn--submit" id="submit-btn">
                    File a Public Complaint
                </button>
            </div>
        </form>
    </main>

    <!-- =========================================================================
         FOOTER
         ========================================================================= -->
    <footer class="footer">
        <p>&copy; 2026 SuGriev · Public Grievance Portal. All rights reserved.</p>
    </footer>

    <!-- =========================================================================
         JAVASCRIPT
         ========================================================================= -->
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
</body>

</html>
