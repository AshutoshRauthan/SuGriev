<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SuGiev Public Grievance Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        .login-container {
            max-width: 400px;
            margin: 4rem auto;
            padding: 0 1rem;
        }

        .login-card {
            background-color: var(--color-bg-white);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-lg);
        }

        .login-header h2 {
            font-size: var(--font-size-xl);
            color: var(--color-primary);
            margin-bottom: var(--spacing-xs);
        }

        .login-header p {
            color: var(--color-text-secondary);
        }

        .login-btn {
            width: 100%;
            justify-content: center;
        }
    </style>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header__brand">
            <div class="header__logo">
                <img src="assets/logo.png" alt="SUGRIEV Logo">
            </div>
            <div class="header__title">
                <h1>SuGriev</h1>
                <span>
                    Public Grievance Portal | जन शिकायत पोर्टल
                </span>
            </div>

    </header>

    <!-- MAIN LOGIN CONTENT -->
    <main class="main">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <span class="material-symbols-outlined"
                        style="font-size: 48px; color: var(--color-primary); margin-bottom: 1rem;">admin_panel_settings</span>
                    <h2>Admin Login</h2>
                    <p>Please sign in to access the dashboard</p>
                </div>

                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required placeholder="Enter admin username">
                    </div>
                    <div class="form-group" style="margin-bottom: 24px;">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required placeholder="Enter password">
                    </div>
                    <button type="submit" class="btn btn--submit login-btn">
                        Login to Dashboard
                    </button>
                </form>
                <div style="margin-top: 1rem; text-align: center; font-size: 0.9em; color: #666;">
                    <p>Hint: Use <strong>admin</strong> / <strong>admin</strong></p>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 SUGRIEV · Public Grievance Portal. All rights reserved.</p>
    </footer>

    <script src="config.js"></script>
    <script src="api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function (e) {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = this.querySelector('button[type="submit"]');

            // Disable button
            const originalText = submitBtn.textContent;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                // Call API
                const response = await API.adminLogin(username, password);

                // Set session flag (in production, store token)
                sessionStorage.setItem('isAdmin', 'true');

                // Redirect to dashboard
                window.location.href = 'dashboard.html';
            } catch (error) {
                alert(error.message || 'Invalid credentials! Please try again.');
            } finally {
                // Re-enable button
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>

</html>
