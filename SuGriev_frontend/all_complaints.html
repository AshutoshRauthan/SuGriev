<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SUGRIEV Admin - All Complaints">
    <title>All Complaints | SuGiev Public Grievance Portal</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script>
        // Check for admin session
        if (!sessionStorage.getItem('isAdmin')) {
            window.location.href = 'admin_login.html';
        }
    </script>
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header__brand">
            <div class="header__logo">
                <img src="assets/logo.png" alt="SUGRIEV Logo">
            </div>
            <div class="header__title">
                <h1>SuGriev</h1>
                <span>Public Grievance Portal | जन शिकायत पोर्टल</span>
            </div>
        </div>
        <nav class="header__nav">
            <a href="dashboard.html" class="btn btn--outline" style="margin-right: 1rem;">
                <span class="material-symbols-outlined">dashboard</span> Dashboard
            </a>
            <button id="logout-btn" class="btn btn--primary" onclick="logout()">
                <span class="material-symbols-outlined">logout</span> Logout
            </button>
        </nav>
    </header>

    <!-- MAIN CONTENT -->
    <main class="main">
        <div class="page-header">
            <h1 class="page-header__title">ALL COMPLAINTS</h1>
            <p class="page-header__subtitle">सभी शिकायतें</p>
        </div>

        <section class="table-section">
            <div class="table-header">
                <h2>Complaint List</h2>
                <div class="table-actions">
                    <select id="dept-filter"
                        style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--color-border); max-width: 200px;">
                        <option value="">All Departments</option>
                        <!-- Populated dynamiclly via JS -->
                    </select>
                </div>
            </div>
            <table class="data-table" id="complaints-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Department</th>
                        <th>District</th>
                        <th>Urgency</th>
                        <th>Status</th>
                        <th>Similar</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="complaints-tbody">
                    <!-- Rows rendered via JS -->
                    <tr>
                        <td colspan="6" style="text-align:center">Loading...</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="footer">
        <p>&copy; 2026 SuGriev Public Grievance Portal. All rights reserved.</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="config.js"></script>
    <script src="api.js"></script>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                const allComplaints = await API.getComplaints();
                renderComplaintsTable(allComplaints);

                // Populate Department Filter dynamically from app.js data
                const filterSelect = document.getElementById('dept-filter');
                if (filterSelect && typeof uttarakhandDepartments !== 'undefined') {
                    Object.keys(uttarakhandDepartments).forEach(dept => {
                        const option = document.createElement('option');
                        option.value = dept; // e.g. "Public Works Department (PWD)"
                        option.textContent = dept;
                        filterSelect.appendChild(option);
                    });
                }

                // Filter logic
                document.getElementById('dept-filter').addEventListener('change', function () {
                    const filterValue = this.value.toLowerCase();
                    if (!filterValue) {
                        renderComplaintsTable(allComplaints);
                        return;
                    }

                    const filtered = allComplaints.filter(c => {
                        // Handle potential different structures
                        const dept = (c.department || (c.complaint && c.complaint.department) || '').toLowerCase();
                        return dept.includes(filterValue);
                    });
                    renderComplaintsTable(filtered);
                });

            } catch (error) {
                console.error('Error loading complaints:', error);
                document.getElementById('complaints-tbody').innerHTML =
                    '<tr><td colspan="6" style="text-align:center; color:red">Failed to load complaints</td></tr>';
            }
        });

        function logout() {
            sessionStorage.removeItem('isAdmin');
            window.location.href = 'admin_login.html';
        }
    </script>
</body>

</html>
